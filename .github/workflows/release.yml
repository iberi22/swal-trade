name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  gate:
    name: Gate Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Resolve Target Version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          # Strip 'v' prefix
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run Release Check
        run: node scripts/release-check.mjs --version $VERSION

      - name: Gate - Public Site Tests
        run: node --test workers/public-site/test/

      - name: Gate - Radar Tests
        run: python3 -I -m unittest discover -s radar/tests -t .

      - name: Gate - MCP Tests
        run: cd packages/mcp && npm ci --ignore-scripts && npm test

      - name: Gate - Extension Tests
        run: cd apps/extension && npm ci --ignore-scripts && npx wxt prepare && npx vitest run

      - name: Gate - Scripts Tests
        run: node --test scripts/

      - name: Gate - Check Docs
        run: node scripts/check-docs.mjs

      - name: Gate - MCP Verify Pack
        run: cd packages/mcp && node scripts/verify-pack.mjs

  release:
    name: Publish Release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Resolve Target Version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Pack MCP
        run: |
          cd packages/mcp
          npm ci --ignore-scripts
          npm pack

      - name: Build Extension Zip
        run: |
          cd apps/extension
          npm ci --ignore-scripts
          npx wxt prepare
          npm run zip

      - name: Extract Release Notes
        run: |
          # Use awk to extract the section starting with ## [X.Y.Z] and ending before the next ## [
          awk '/^## \['"$VERSION"'\]/ {flag=1; print; next} /^## \[/ {if(flag) exit} flag' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect artifacts
          MCP_TGZ=$(ls packages/mcp/*.tgz | head -n 1)
          EXT_ZIP=$(ls apps/extension/.output/*-*.zip | head -n 1 || ls apps/extension/*.zip | head -n 1 || echo "")

          if [ -n "$EXT_ZIP" ]; then
            gh release create $TAG --notes-file release-notes.md "$MCP_TGZ" "$EXT_ZIP"
          else
            gh release create $TAG --notes-file release-notes.md "$MCP_TGZ"
          fi
