name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-site:
    name: public-site (tests y sintaxis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tests del Worker
        run: node --test workers/public-site/test/
      - name: Tests de la prueba de claves
        run: node --test apps/key-spike/signing.test.mjs
      - name: Comprobar sintaxis
        run: |
          # Todo el JS versionado del Worker y de las páginas, salvo vendor/.
          git ls-files 'workers/public-site/src/*.js' 'workers/public-site/static/**/*.js' \
            | grep -v '/vendor/' | xargs -n1 node --check
          bash -n scripts/publish-public-snapshot.sh
          node --check apps/key-spike/app.js
          node --check apps/key-spike/signing.js

  radar:
    name: radar (tests, Python + núcleo JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tests del radar
        run: python3 -I -m unittest discover -s radar/tests -t .
      - name: Comprobar sintaxis
        run: |
          python3 -m compileall -q radar
          node --check radar/detect.mjs

  synapse-core:
    name: synapse-core (Rust + WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rustup del runner, sin acciones de terceros)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p synapse-core --all-targets -- -D warnings
      - name: Tests (incluye doctests)
        run: cargo test -p synapse-core
      - name: Compilación a WebAssembly
        run: cargo build -p synapse-core --target wasm32-unknown-unknown --features wasm --release

  mcp:
    name: mcp (pruebas y paquete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Pruebas del MCP
        run: cd packages/mcp && npm ci --ignore-scripts && npm test
      - name: Paquete instalable
        run: cd packages/mcp && node scripts/verify-pack.mjs

  extension:
    name: extension (pruebas y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Pruebas de la extension
        run: cd apps/extension && npm ci --ignore-scripts && npx wxt prepare && npx vitest run
      - name: Build de la extension
        run: cd apps/extension && npm run build

  docs:
    name: docs (referencias y afirmaciones de seguridad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Referencias rotas
        run: node scripts/check-docs.mjs
      - name: Afirmaciones de seguridad
        run: node scripts/check-security-claims.mjs
      - name: Pruebas de los verificadores
        run: node --test scripts/*.test.mjs

  e2e:
    name: e2e (sitio, extension y MCP)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Dependencias del navegador
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: e2e completo
        run: ./e2e/run-all.sh

  security:
    name: security (gitleaks, historial completo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
