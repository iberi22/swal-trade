name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-site:
    name: public-site (tests y sintaxis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tests del Worker
        run: node --test workers/public-site/test/
      - name: Tests de la prueba de claves
        run: node --test apps/key-spike/signing.test.mjs
      - name: Comprobar sintaxis
        run: |
          node --check workers/public-site/src/worker.js
          node --check workers/public-site/static/app.js
          bash -n scripts/publish-public-snapshot.sh
          node --check apps/key-spike/app.js
          node --check apps/key-spike/signing.js

  security:
    name: security (gitleaks, historial completo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
