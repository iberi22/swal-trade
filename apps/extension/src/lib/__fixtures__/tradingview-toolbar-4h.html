<!doctype html>
<!--
  TradingView con el intervalo en sufixos de texto y sin aria-checked: la
  elegida está marcada solo con clase (aria-pressed en este variante).
-->
<html lang="en">
  <head><title>ETHUSDT · 4h · BINANCE</title></head>
  <body>
    <div id="header-toolbar-intervals" class="interval-toolbar" role="group">
      <button type="button" class="toolbar-btn">1m</button>
      <button type="button" class="toolbar-btn">15m</button>
      <button type="button" class="toolbar-btn active" aria-pressed="true">4h</button>
      <button type="button" class="toolbar-btn">1D</button>
    </div>
  </body>
</html>
