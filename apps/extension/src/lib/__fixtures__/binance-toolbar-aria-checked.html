<!doctype html>
<!--
  Variante de Binance sin clase activa: la SPA marca la elegida con
  aria-checked y data-state, y deja el resto sin marca ninguna.
-->
<html lang="en">
  <head><title>ETHUSDT | Binance Futures</title></head>
  <body>
    <div class="bn-kline-interval" role="group" aria-label="Interval">
      <button type="button" data-value="1m">1m</button>
      <button type="button" data-value="1h" aria-checked="true" data-state="active">1h</button>
      <button type="button" data-value="1d">1d</button>
    </div>
  </body>
</html>
