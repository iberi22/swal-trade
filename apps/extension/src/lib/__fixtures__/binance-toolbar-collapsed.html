<!doctype html>
<!--
  Binance con la barra plegada: solo se ve el intervalo elegido dentro de un
  contenedor que se llama intervalo. Es el caso que resuelve toolbarInterval.
-->
<html lang="en">
  <head><title>SOLUSDT | Binance Futures</title></head>
  <body>
    <div class="chart-header">
      <span class="symbol">SOLUSDT</span>
      <div class="interval-dropdown-trigger" aria-haspopup="true">
        <span class="interval-label current-interval is-active">1d</span>
        <svg class="chevron" viewBox="0 0 12 12"></svg>
      </div>
      <div class="interval-menu" hidden>
        <div class="interval-item" data-value="1m">1m</div>
        <div class="interval-item" data-value="1h">1h</div>
        <div class="interval-item" data-value="1d">1d</div>
      </div>
    </div>
  </body>
</html>
