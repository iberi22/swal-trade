<!doctype html>
<!--
  Barra de intervalos de TradingView. Aquí el código pelado es el formato
  normal (60 = 1h, 240 = 4h, 1440 = 1d) y el elegido lleva aria-checked.
-->
<html lang="en">
  <head><title>BTCUSDT · 1D · BINANCE</title></head>
  <body>
    <div id="header-toolbar-intervals" class="toolbar-Root_uiINTERVAL" role="group">
      <button type="button" class="apply-common-tooltip" data-value="1">1</button>
      <button type="button" class="apply-common-tooltip" data-value="5">5</button>
      <button type="button" class="apply-common-tooltip" data-value="15">15</button>
      <button type="button" class="apply-common-tooltip" data-value="60">60</button>
      <button type="button" class="apply-common-tooltip" data-value="240">240</button>
      <button type="button" class="apply-common-tooltip isActive" data-value="1440" aria-checked="true">
        1D
      </button>
    </div>
    <div class="chart-container">
      <div class="price-axis">43,102.0</div>
    </div>
  </body>
</html>
