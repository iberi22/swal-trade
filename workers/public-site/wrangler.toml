name = "swal-trade"
main = "src/worker.js"
compatibility_date = "2026-09-16"
workers_dev = false
routes = [
  { pattern = "trade.swal.network", custom_domain = true }
]

# Dead-man: avisa por Telegram si dejan de llegar snapshots (STALE_AFTER_S, defecto 300).
# El mismo cron (cada 5 min) recoge noticias, pero el worker solo llama a un proveedor
# cada 30 min (rotación). Secrets (wrangler secret put):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   BRAVE_API_KEY, TAVILY_API_KEY, FIRECRAWL_API_KEY
[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "./static"
binding = "ASSETS"

# Workers AI: el explicador de /analisis/ (POST /api/explain). Sin este binding el
# endpoint responde con el respaldo determinista, nunca con error. Vars (opcionales):
#   EXPLAIN_MODEL       modelo por defecto @cf/meta/llama-3.3-70b-instruct-fp8-fast
#                       (instruct rápido y con JSON Mode en el catálogo actual)
#   EXPLAIN_MAX_TOKENS  tope de tokens de salida (defecto 480)
#   EXPLAIN_DAILY_CAP   llamadas al modelo por día UTC (defecto 500; 0 = solo respaldo)
[ai]
binding = "AI"

# Cupo diario del explicador en producción: ~60 llamadas caben en los 10.000 neurons
# gratuitos de Workers AI (prompts de ~10 KB). Al agotarse responde el respaldo determinista.
[vars]
EXPLAIN_DAILY_CAP = "60"

# Logs de Workers (dentro del cupo gratuito) para diagnosticar fallos del sitio y del dead-man.
[observability]
enabled = true

# KV namespace for public trading snapshots.
# The orchestrator or deployer fills the namespace ID below after creating it via:
# wrangler kv namespace create SNAPSHOTS
[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "03c8f6ddfa0f4498b952700977c781b4"

# Snapshot público en D1 (100.000 escrituras/día gratis). KV queda como respaldo de lectura:
# el plan gratuito solo permite 1.000 escrituras KV/día para toda la cuenta.
# Noticias: la misma base D1 (tabla news, migración 0002) y el mismo KV SNAPSHOTS
# como respaldo si no hay binding DB. No hay un namespace ni una base nuevos.
[[d1_databases]]
binding = "DB"
database_name = "swal-trade-public"
database_id = "02b5d8ec-cfbc-476d-aeb9-8ace9ec59d09"
migrations_dir = "migrations"

# Respaldo cifrado de extremo a extremo (PUT/GET/DELETE /api/backup; migración 0004_backup.sql).
# El servidor solo guarda el sobre {v,kdf,iter,salt,iv,ct}: nunca la frase ni el texto en claro.
# Vars (todas opcionales):
#   BACKUP_LICENSE_PUBKEY  clave SPKI base64 de licencias. Si se fija aquí no se consulta la red.
#                           Si falta, se lee de https://pay.swal.network/v1/pubkey (campo spki_base64).
#   BACKUP_RATE_LIMIT      peticiones por hora por cuenta (defecto 60), para cuidar las escrituras de D1.
#   BACKUP_DEV_OPEN        "gratis durante desarrollo": en true acepta cualquier token como cuenta
#                           de desarrollo (prefijo "dev:"), sin licencia real. NUNCA en producción.
